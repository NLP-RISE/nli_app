[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nli-entailment-app"
version = "0.1.0"
description = "Minimal Streamlit zero-shot text classifier using a local Hugging Face model"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
    "torch>=2.4",
    "transformers>=5,<6",
    "pytest (>=9.2.0,<10.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that load and run a real Hugging Face model",
]
